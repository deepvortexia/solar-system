<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Solar System 3D — Interactive Explorer</title>
  <meta name="description" content="Interactive 3D solar system built in Blender. Click any planet to explore real planetary data." />
</head>
<body>
  <div id="loading">
    <div class="loader-ring"></div>
    <p>Loading solar system…</p>
  </div>

  <div id="hint">Drag to orbit &middot; Scroll to zoom &middot; Click a planet</div>

  <button id="reset-view" aria-label="Reset view" title="Reset view">&#10227;</button>

  <button id="enter-space" style="display:none">&#10022; GO TO SPACE &#10022;</button>

  <div id="avatar-selection">
    <div class="avatar-card" id="card-terra">
      <div class="avatar-card-glow"></div>
      <div class="avatar-emoji">🌍</div>
      <div class="avatar-name">Terra</div>
      <div class="avatar-speed">⚡ Vitesse 1x</div>
      <div class="avatar-price">GRATUIT</div>
      <div class="avatar-select-btn">CHOISIR</div>
    </div>
    <div class="avatar-card" id="card-rosalys">
      <div class="avatar-card-glow"></div>
      <div class="avatar-emoji">🧚</div>
      <div class="avatar-name">Rosalys</div>
      <div class="avatar-speed">⚡ Vitesse 10x</div>
      <div class="avatar-price">4.99$</div>
      <div class="avatar-select-btn">CHOISIR</div>
    </div>
  </div>

  <button id="back-to-temple" style="display:none">&#11013; Temple</button>

  <div id="tooltip"></div>

  <div id="planet-badge"></div>

  <aside id="info-panel">
    <button id="close-panel" aria-label="Close">&times;</button>
    <h2 id="info-name"></h2>
    <p id="info-type"></p>
    <div id="info-stats"></div>
    <p id="info-fact"></p>
  </aside>

  <div id="surface-panel">
    <h2>Visiting Earth</h2>
    <p>You've descended to the surface. Drag to look around.</p>
    <button id="surface-return">Return to space</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
